<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floralhelp - Order Calendar</title>

    <link rel="icon" type="image/jpeg" href="Favicon.jpg">
    <link rel="apple-touch-icon" href="Favicon.jpg">

    <!-- Apple Touch Icon (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Floralhelp">
    <meta name="theme-color" content="#FF69B4">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50: #FFF0F5;
            --pink-100: #FFE4EF;
            --pink-200: #FFB6C1;
            --pink-300: #FF91A4;
            --pink-400: #FF69B4;
            --pink-500: #FF1493;
            --white: #FFFFFF;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-400: #A3A3A3;
            --gray-600: #525252;
            --gray-800: #1F1F1F;
            --status-pending: #FFF3E0;
            --status-pending-text: #E65100;
            --status-preparing: #E8F5E9;
            --status-preparing-text: #2E7D32;
            --status-delivering: #E3F2FD;
            --status-delivering-text: #1565C0;
            --status-done: #F3E5F5;
            --status-done-text: #7B1FA2;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow-sm: 0 2px 8px rgba(255, 105, 180, 0.08);
            --shadow-md: 0 4px 16px rgba(255, 105, 180, 0.12);
            --shadow-lg: 0 8px 32px rgba(255, 105, 180, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, var(--pink-50) 0%, #FFF5F9 50%, var(--white) 100%);
            min-height: 100vh;
            color: var(--gray-800);
            overflow-x: hidden;
        }

        /* Floating decorative elements */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 300px;
            height: 300px;
            background: var(--pink-400);
            top: -100px;
            right: -80px;
            filter: blur(60px);
        }
        body::after {
            width: 250px;
            height: 250px;
            background: var(--pink-300);
            bottom: -50px;
            left: -60px;
            filter: blur(50px);
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 24px 0 8px;
        }

        .header-logo {
            font-size: 40px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--pink-500);
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--gray-400);
            font-weight: 600;
            margin-top: 2px;
        }

        /* ===== CALENDAR CARD ===== */
        .calendar-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-top: 16px;
            box-shadow: var(--shadow-lg);
            border: 1.5px solid var(--pink-100);
            overflow: hidden;
            position: relative;
        }

        .calendar-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--pink-300), var(--pink-400), var(--pink-300));
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .calendar-nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--pink-50);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--pink-400);
            font-size: 18px;
            font-weight: 700;
        }

        .calendar-nav-btn:hover {
            background: var(--pink-100);
            transform: scale(1.1);
        }

        .calendar-nav-btn:active {
            transform: scale(0.95);
        }

        .calendar-month-label {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-800);
        }

        .calendar-month-label span {
            color: var(--pink-400);
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .calendar-grid.slide-left {
            animation: slideLeft 0.3s ease;
        }

        .calendar-grid.slide-right {
            animation: slideRight 0.3s ease;
        }

        @keyframes slideLeft {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .calendar-weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-400);
            padding: 8px 0;
            text-transform: uppercase;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-800);
            gap: 2px;
        }

        .calendar-day:hover {
            background: var(--pink-50);
            transform: scale(1.08);
        }

        .calendar-day.empty {
            cursor: default;
        }

        .calendar-day.empty:hover {
            background: transparent;
            transform: none;
        }

        .calendar-day.today {
            background: var(--white);
            color: var(--gray-800);
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .calendar-day.today::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            padding: 2.5px;
            background: linear-gradient(135deg, #FF0000, #FF8C00, #FFD700, #32CD32, #00BFFF, #8A2BE2, #FF69B4);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            animation: rainbowRotate 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes rainbowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .calendar-day.today:hover {
            background: var(--pink-50);
        }

        .calendar-day.today .order-dot {
            background: var(--pink-400);
        }

        .calendar-day.has-orders {
            background: var(--pink-50);
        }

        .calendar-day.selected {
            background: var(--pink-100);
            border: 2px solid var(--pink-400);
        }

        .calendar-day.today.selected {
            background: var(--pink-50);
            border: none;
        }

        .order-dot-container {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 6px;
        }

        .order-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--pink-400);
        }

        .order-badge {
            font-size: 8px;
            font-weight: 800;
            color: var(--pink-500);
            line-height: 1;
        }

        .calendar-day.today .order-badge {
            color: var(--pink-500);
        }

        /* Summary bar */
        .month-summary {
            display: flex;
            justify-content: space-around;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1.5px dashed var(--pink-100);
        }

        .summary-item {
            text-align: center;
        }

        .summary-number {
            font-size: 22px;
            font-weight: 800;
            color: var(--pink-500);
        }

        .summary-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== ORDERS SECTION ===== */
        .orders-section {
            margin-top: 24px;
            padding-bottom: 40px;
        }

        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .orders-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-800);
        }

        .orders-count {
            font-size: 12px;
            font-weight: 700;
            color: var(--white);
            background: var(--pink-400);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Date Group */
        .date-group {
            margin-bottom: 20px;
        }

        .date-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .date-group-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-300), var(--pink-400));
            flex-shrink: 0;
        }

        .date-group-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-600);
        }

        .date-group-line {
            flex: 1;
            height: 1.5px;
            background: var(--pink-100);
            border-radius: 1px;
        }

        /* Order Card - Locket Style */
        .order-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-md);
            border: 1.5px solid var(--pink-100);
            transition: all 0.2s ease;
            animation: fadeInUp 0.4s ease backwards;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .order-product {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .order-emoji {
            font-size: 32px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pink-50);
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }

        .order-product-info {
            flex: 1;
            min-width: 0;
        }

        .order-product-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-800);
            line-height: 1.3;
        }

        .order-product-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--pink-500);
            margin-top: 2px;
        }

        .order-status {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .order-status.pending {
            background: var(--status-pending);
            color: var(--status-pending-text);
        }

        .order-status.preparing {
            background: var(--status-preparing);
            color: var(--status-preparing-text);
        }

        .order-status.delivering {
            background: var(--status-delivering);
            color: var(--status-delivering-text);
        }

        .order-status.done {
            background: var(--status-done);
            color: var(--status-done-text);
        }

        .order-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .order-detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray-600);
        }

        .order-detail-icon {
            width: 16px;
            text-align: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .order-detail-text {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-divider {
            height: 1px;
            background: var(--pink-50);
            margin: 10px 0;
        }

        /* Show more button - Locket style */
        .show-more-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px dashed var(--pink-200);
            background: var(--white);
            border-radius: var(--radius-lg);
            color: var(--pink-400);
            font-size: 14px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .show-more-btn:hover {
            background: var(--pink-50);
            border-color: var(--pink-400);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .show-more-btn:active {
            transform: scale(0.98);
        }

        .show-more-btn span {
            display: inline-block;
            margin-left: 6px;
            transition: transform 0.2s ease;
        }

        .show-more-btn:hover span {
            transform: translateY(2px);
        }

        /* Active day filter chip */
        .active-day-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--pink-400);
            color: var(--white);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            animation: fadeInUp 0.2s ease;
        }

        .active-day-chip-close {
            width: 18px;
            height: 18px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: var(--white);
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            font-family: 'Nunito', sans-serif;
            line-height: 1;
            padding: 0;
        }

        .active-day-chip-close:hover {
            background: rgba(255,255,255,0.5);
        }

        /* No orders message */
        .no-orders {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-400);
        }

        .no-orders-emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .no-orders-text {
            font-size: 14px;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 520px) {
            .app-container {
                padding: 24px;
            }

            .calendar-day {
                font-size: 15px;
            }

            .order-card {
                padding: 20px;
            }
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 540px;
            }
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--pink-200);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--pink-300);
        }

        /* Locket-style pill tabs for filter */
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--pink-200);
            background: var(--white);
            color: var(--gray-600);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: 'Nunito', sans-serif;
        }

        .filter-pill:hover {
            border-color: var(--pink-400);
            color: var(--pink-400);
        }

        .filter-pill.active {
            background: var(--pink-400);
            color: var(--white);
            border-color: var(--pink-400);
        }
    </style>
</head>
<body>

        <!-- Header -->
        <div class="header">
            <div class="header-logo">🌸</div>
            <div class="header-title">Floralhelp</div>
            <div class="header-subtitle">Order Calendar Dashboard</div>

            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="month-summary" id="monthSummary"></div>

        <!-- Orders Section -->
        <div class="orders-section">
            <div class="orders-header">

            <!-- Filter Pills -->

                <button class="filter-pill" data-filter="done">Đã giao</button>
            </div>

            <div id="ordersList"></div>
        </div>
    </div>

                price: 3500000,
                status: 'pending',
                note: 'Set đầy đủ: bó cầm tay + hoa cài áo + hoa bàn tiệc x10'
            },
            {
                id: 10,
                date: '2026-05-25',
                product: 'Chậu hoa lan hồ điệp',
                emoji: '🪻',
                customer: 'Trịnh Công Sơn',
                phone: '0990 123 456',
                address: '42 Tôn Đức Thắng, Q.1, TP.HCM',
                time: '10:00',
                price: 1800000,
                status: 'pending',
                note: 'Chậu 6 cành, màu tím'
            }
        ];

        // ===== STATE =====
        let currentDate = new Date(2026, 4, 1); // May 2026
        let selectedDay = null;
        let activeFilter = 'all';
        const ORDERS_PER_PAGE = 5;
        let visibleCount = ORDERS_PER_PAGE;

        // ===== HELPERS =====
        const WEEKDAYS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
        const MONTHS = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6',
                        'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];

        const STATUS_MAP = {
            pending: { label: 'Chờ xác nhận', class: 'pending' },
            preparing: { label: 'Đang chuẩn bị', class: 'preparing' },
            delivering: { label: 'Đang giao', class: 'delivering' },
            done: { label: 'Đã giao', class: 'done' }
        };

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
        }

        function getOrdersForMonth(year, month) {
            return MOCK_ORDERS.filter(order => {
                const d = new Date(order.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });
        }

        function getOrdersForDay(year, month, day) {
            return MOCK_ORDERS.filter(order => {
                const d = new Date(order.date);
                return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
            });
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function getFirstDayOfMonth(year, month) {
            let day = new Date(year, month, 1).getDay();
            return day === 0 ? 6 : day - 1; // Monday = 0
        }

        function isToday(year, month, day) {
            const today = new Date();
            return today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        }

        // ===== RENDER CALENDAR =====
        function renderCalendar(direction) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month label
            document.getElementById('monthLabel').innerHTML =
                `${MONTHS[month]} <span>${year}</span>`;

            const grid = document.getElementById('calendarGrid');

            // Animation
            if (direction) {
                grid.classList.remove('slide-left', 'slide-right');
                void grid.offsetWidth; // Force reflow
                grid.classList.add(direction === 'next' ? 'slide-left' : 'slide-right');
            }

            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month);
            const monthOrders = getOrdersForMonth(year, month);

            // Count orders per day
            const ordersByDay = {};
            monthOrders.forEach(order => {
                const day = new Date(order.date).getDate();
                ordersByDay[day] = (ordersByDay[day] || 0) + 1;
            });

            let html = '';

            // Weekday headers
            WEEKDAYS.forEach(day => {
                html += `<div class="calendar-weekday">${day}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            // Day cells
            for (let day = 1; day <= daysInMonth; day++) {
                const today = isToday(year, month, day);
                const hasOrders = ordersByDay[day] > 0;
                const isSelected = selectedDay === day;
                const count = ordersByDay[day] || 0;

                let classes = 'calendar-day';
                if (today) classes += ' today';
                if (hasOrders) classes += ' has-orders';
                if (isSelected) classes += ' selected';

                let dots = '';
                if (count > 0 && count <= 3) {
                    dots = '<div class="order-dot-container">' +
                           Array(count).fill('<div class="order-dot"></div>').join('') +
                           '</div>';
                } else if (count > 3) {
                    dots = `<div class="order-badge">${count}</div>`;
                }

                html += `<div class="${classes}" data-day="${day}" onclick="selectDay(${day})">${day}${dots}</div>`;
            }

            grid.innerHTML = html;

            // Render summary
            renderSummary(monthOrders);
        }

        function renderSummary(orders) {
            const total = orders.length;
            const pending = orders.filter(o => o.status === 'pending').length;
            const revenue = orders.reduce((sum, o) => sum + o.price, 0);

            document.getElementById('monthSummary').innerHTML = `
                <div class="summary-item">
                    <div class="summary-number">${total}</div>
                    <div class="summary-label">Đơn hàng</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number">${pending}</div>
                    <div class="summary-label">Chờ xử lý</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number">${formatPrice(revenue)}</div>
                    <div class="summary-label">Doanh thu</div>
                </div>
            `;
        }

        // ===== RENDER ORDERS =====
        function renderOrders() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            let orders = getOrdersForMonth(year, month);

            // Apply filter
            if (activeFilter !== 'all') {
                orders = orders.filter(o => o.status === activeFilter);
            }

            // If a day is selected, filter to that day
            if (selectedDay !== null) {
                orders = orders.filter(o => {
                    const d = new Date(o.date);
                    return d.getDate() === selectedDay;
                });
            }

            const totalOrders = orders.length;

            // Update count
            document.getElementById('ordersCount').textContent = `${totalOrders} đơn`;

            if (totalOrders === 0) {
                document.getElementById('ordersList').innerHTML = `
                    <div class="no-orders">
                        <div class="no-orders-emoji">🌿</div>
                        <div class="no-orders-text">Không có đơn hàng nào</div>
                    </div>
                `;
                return;
            }

            // Sort all orders
            orders.sort((a, b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time));

            // Limit visible orders (only when no specific day is selected)
            const isLimited = selectedDay === null && totalOrders > visibleCount;
            const displayOrders = isLimited ? orders.slice(0, visibleCount) : orders;
            const remaining = totalOrders - visibleCount;

            // Group by date
            const grouped = {};
            displayOrders.forEach(order => {
                if (!grouped[order.date]) grouped[order.date] = [];
                grouped[order.date].push(order);
            });

            let html = '';

            // Active day chip
            if (selectedDay !== null) {
                html += `<div class="active-day-chip">
                    Ngày ${selectedDay} ${MONTHS[month]}
                    <button class="active-day-chip-close" onclick="clearSelectedDay()">✕</button>
                </div>`;
            }

            let cardIndex = 0;

            Object.entries(grouped).forEach(([date, dateOrders]) => {
                html += `
                    <div class="date-group" id="date-${new Date(date).getDate()}">
                        <div class="date-group-header">
                            <div class="date-group-dot"></div>
                            <div class="date-group-label">${formatDate(date)}</div>
                            <div class="date-group-line"></div>
                        </div>
                `;

                dateOrders.forEach(order => {
                    const status = STATUS_MAP[order.status];
                    html += `
                        <div class="order-card" style="animation-delay: ${cardIndex * 0.05}s">
                            <div class="order-card-top">
                                <div class="order-product">
                                    <div class="order-emoji">${order.emoji}</div>
                                    <div class="order-product-info">
                                        <div class="order-product-name">${order.product}</div>
                                        <div class="order-product-price">${formatPrice(order.price)}</div>
                                    </div>
                                </div>
                                <div class="order-status ${status.class}">${status.label}</div>
                            </div>
                            <div class="order-divider"></div>
                            <div class="order-details">
                                <div class="order-detail-row">
                                    <span class="order-detail-icon">👤</span>
                                    <span class="order-detail-text">${order.customer}</span>
                                </div>
                                <div class="order-detail-row">
                                    <span class="order-detail-icon">📞</span>
                                    <span class="order-detail-text">${order.phone}</span>
                                </div>
                                <div class="order-detail-row">
                                    <span class="order-detail-icon">📍</span>
                                    <span class="order-detail-text">${order.address}</span>
                                </div>
                                <div class="order-detail-row">
                                    <span class="order-detail-icon">🕐</span>
                                    <span class="order-detail-text">${order.time}</span>
                                </div>
                                ${order.note ? `
                                <div class="order-detail-row">
                                    <span class="order-detail-icon">📝</span>
                                    <span class="order-detail-text">${order.note}</span>
                                </div>` : ''}
                            </div>
                        </div>
                    `;
                    cardIndex++;
                });

                html += '</div>';
            });

            // Show more button
            if (isLimited) {
                html += `<button class="show-more-btn" onclick="showMore()">
                    Xem thêm ${remaining > ORDERS_PER_PAGE ? ORDERS_PER_PAGE : remaining} đơn hàng nữa (còn ${remaining} đơn) <span>↓</span>
                </button>`;
            }

            document.getElementById('ordersList').innerHTML = html;
        }

        // ===== EVENT HANDLERS =====
        function showMore() {
            visibleCount += ORDERS_PER_PAGE;
            renderOrders();
        }

        function clearSelectedDay() {
            selectedDay = null;
            visibleCount = ORDERS_PER_PAGE;
            renderCalendar();
            renderOrders();
        }

        function selectDay(day) {
            if (selectedDay === day) {
                selectedDay = null; // Deselect
            } else {
                selectedDay = day;
            }
            renderCalendar();
            renderOrders();

            // Scroll to orders if a day is selected
            if (selectedDay !== null) {
                const target = document.getElementById(`date-${day}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            selectedDay = null;
            visibleCount = ORDERS_PER_PAGE;
            renderCalendar('prev');
            renderOrders();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            selectedDay = null;
            visibleCount = ORDERS_PER_PAGE;
            renderCalendar('next');
            renderOrders();
        });

        // Filter pills
        document.getElementById('filterBar').addEventListener('click', (e) => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;

            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            activeFilter = pill.dataset.filter;
            visibleCount = ORDERS_PER_PAGE;
            renderOrders();
        });

        // ===== INIT =====
        renderCalendar();
        renderOrders();
    </script>
</body>
</html>
